name: Secret Scan

# Fails the push if any commit adds something that looks like a credential:
# API keys, tokens, private keys, passwords in config. This repo is public,
# and an RDP file and a password have already had to be scrubbed from its
# history once.
#
# Reviewed false positives go in .gitleaksignore by fingerprint.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret added and deleted in the same push is
          # still published.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m755 gitleaks /usr/local/bin/gitleaks

      - name: Scan history
        # --redact: the log must never print the secret it just found.
        run: gitleaks git --redact --no-banner --verbose .
