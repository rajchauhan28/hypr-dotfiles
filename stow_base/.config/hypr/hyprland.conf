source = ~/.cache/wal/colors-hyprland.conf
# Written by Install.sh: GPU/vendor/battery-specific settings only.
source = ~/.config/hypr/hardware.conf
monitor = , preferred, auto, 1
# No per-connector override: the catch-all above gives every monitor its
# own preferred mode. Add a specific line here only for a display whose
# EDID advertises a bad preferred mode.
# workspace = 6, monitor:HDMI-A-1
# workspace = 7, monitor:HDMI-A-1
# workspace = 8, monitor:HDMI-A-1
# workspace = 9, monitor:HDMI-A-1
# workspace = 10, monitor:HDMI-A-1

# --- VARIABLES ---
$terminal = ghostty
$fileManager = dolphin
$menu = qs ipc call launcher apps
$browser = brave
$wallpaperSwitcher = $HOME/.config/hypr/wallpaper_switcher.sh
$mainMod = SUPER

# --- ENVIRONMENT VARIABLES ---
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,20
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,kvantum
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_MENU_PREFIX,arch-

# --- EXEC ONCE ---
exec-once = sh -c "dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE && systemctl --user import-environment DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE && systemctl --user start hyprland-session.target && systemctl --user restart walllust-daemon.service pyprland.service hypridle.service"
exec-once = pactl set-sink-mute @DEFAULT_SINK@ 0
exec-once = hyprpm reload -n
exec-once = $wallpaperSwitcher
exec-once = XDG_MENU_PREFIX=arch- kbuildsycoca6
exec-once = $HOME/.config/hypr/mpvpaper-stop.sh &
exec-once = hyprpm update
exec-once = kbuildsycoca6
exec-once = systemctl --user restart hyprpolkitagent 
exec-once = sh -c "command -v libinput-gestures-setup >/dev/null && libinput-gestures-setup start"
exec-once = sh -c "test -x /usr/lib/pam_kwallet_init && /usr/lib/pam_kwallet_init"
# smart_gpu.py is started from hardware.conf (only when a battery exists).
# Consolidated shell (topbar/leftbar/sidepanel/dock/desktop_clock/notifications)
# lives in ~/.config/quickshell/shell.qml; `qs -d` launches that default config.
exec-once = qs -d &
# Lockscreen stays a separate process so reloading the bars can't drop a lock.
exec-once = qs -d -p $HOME/.config/quickshell/lock &

# LIBVA_DRIVER_NAME / NVD_BACKEND live in hardware.conf (GPU-dependent).
env = MOZ_ENABLE_WAYLAND,1
env = XDG_SESSION_TYPE,wayland
# bluetuith
windowrule = match:class ^(bluetuith)$, float on, move 10% 2%, size 80% 30%, workspace special silent, no_anim on



# System Stats
windowrule = match:title (^(System Stats)$), float on, center on, move 1490 50

# Search
windowrule = match:title ^(Search)$, move 750 100

# Font Manager
windowrule = match:class ^(font-manager)$, float on, size 900 600

# Floating rules for specific Ghostty scratchpads

# --- GENERAL ---
general { 
    gaps_in = 2
    gaps_out = 5
    border_size = 0
    col.active_border = $color9
    col.inactive_border = $color5
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

# --- DECORATION (Optimized) ---
decoration {
    rounding = 10
    active_opacity = 0.95
    inactive_opacity = 0.7
    fullscreen_opacity = 1
    
    blur {
        enabled = true
        size = 5           # Increased size slightly to compensate for fewer passes
        passes = 2         # REDUCED from 5 to 2 for massive performance gain
        new_optimizations = true
        ignore_opacity = true
        xray = false
        popups = true
    }
    
    shadow {
        enabled = true
        range = 15
        color = rgba(0,0,0,.5)
    }
}
layerrule = blur, quickshell-lock

# --- ANIMATIONS ---
animations {
    enabled = true
    bezier = fluid, 0.15, 0.85, 0.25, 1
    bezier = snappy, 0.3, 1, 0.4, 1
    animation = windows, 1, 3, fluid, popin 5%
    animation = windowsOut, 1, 2.5, snappy
    animation = fade, 1, 4, snappy
    animation = workspaces, 1, 1.7, snappy, slide
    animation = specialWorkspace, 1, 4, fluid, slidefadevert -35%
    animation = layers, 1, 2, snappy, popin 70%
}

# --- INPUT & GESTURES ---
cursor {
    no_warps = true 
}

input{
    follow_mouse = 1 

    touchpad {
        natural_scroll = true
        scroll_factor = 1.0
    }
}

# Native workspace swipe options were removed in Hyprland 0.55; gestures are
# handled by libinput-gestures in this setup.



dwindle {
    preserve_split = true
}

misc { 
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    focus_on_activate = true
}


# --- BINDS ---
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod SHIFT, W, exec, $wallpaperSwitcher
bind = $mainMod SHIFT, R, exec, $HOME/.config/quickshell/reload.sh
bind = $mainMod, O, exec, $HOME/.config/quickshell/reload.sh
bind = $mainMod, V, togglefloating 
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, F, fullscreen, 1

# Navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move Windows (Added these for you)
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Move Window to Monitor
bind = $mainMod SHIFT, bracketleft, movewindow, mon:l
bind = $mainMod SHIFT, bracketright, movewindow, mon:r

# Focus Monitor
bind = $mainMod, bracketleft, focusmonitor, l
bind = $mainMod, bracketright, focusmonitor, r

bind = $mainMod, N, exec, qs ipc call notifications dismissAll

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Media & Brightness
bindel = ,XF86AudioRaiseVolume, exec, qs ipc call sidepanel volume 1
bindel = ,XF86AudioLowerVolume, exec, qs ipc call sidepanel volume -1
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, qs ipc call sidepanel brightness 1
bindel = ,XF86MonBrightnessDown, exec, qs ipc call sidepanel brightness -1
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
# XF86Launch1 (Predator/Nitro turbo key) is bound in hardware.conf.

# Screenshots
bind = , Print, exec, $HOME/.config/hypr/screenshot.sh region
bind = $mainMod, Print, exec, $HOME/.config/hypr/screenshot.sh output

# Pyprland & Special Workspaces
bind = $mainMod, slash, exec, $HOME/.config/keybinds_gui.py
bind = $mainMod, l, exec, $HOME/.config/quickshell/lock/lock.sh
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod, SPACE, exec, pypr toggle term
bind = $mainMod, G, exec, pypr toggle music
bind = $mainMod, T, exec, pypr toggle taskbar
bind = $mainMod ALT, G, exec, $HOME/.config/hypr/gamemode.sh
bind = $mainMod SHIFT, G, exec, $HOME/.config/hypr/gpu_switcher.sh

# Mouse Binds
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Session
bind = $mainMod, Escape, exec, wlogout -b 2
bind = ALT, ESC, exec, wlogout -b 2  # Changed from TAB to ESC to save Alt-Tab
bind = $mainMod, M, exit

# Quickshell Overview toggle
bind = SUPER, TAB, exec, $HOME/.config/hypr/toggle_overview.sh
