# Custom gestures for Hyprland
#
# On a Lua config `hyprctl dispatch X` runs `return hl.dispatch(X)`, so X must
# be a Lua dispatcher. The old `hyprctl dispatch fullscreen 1` was a Lua syntax
# error and none of these gestures did anything. These are the same calls the
# Super+F / Super+Shift+F binds in hyprland.lua make.

# 3 Fingers Up/Down -> Toggle Semi-Fullscreen (Monocle)
gesture swipe up 3 hyprctl dispatch 'hl.dsp.window.fullscreen({ mode = 1 })'
gesture swipe down 3 hyprctl dispatch 'hl.dsp.window.fullscreen({ mode = 1 })'

# 4 Fingers Up/Down -> Toggle Real Fullscreen
gesture swipe up 4 hyprctl dispatch 'hl.dsp.window.fullscreen()'
gesture swipe down 4 hyprctl dispatch 'hl.dsp.window.fullscreen()'
