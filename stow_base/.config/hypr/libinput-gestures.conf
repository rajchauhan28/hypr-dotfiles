# Touchpad gestures that Hyprland's own hl.gesture() cannot express.
#
# The swipes are native, in hyprland.lua (3 fingers: workspaces, dashboard,
# dock; 4 fingers up/down: fullscreen). This only adds the four-finger click:
# libinput reports four fingers pressed and lifted without moving as a
# 4-finger "hold". If they start moving, libinput cancels the hold and
# libinput-gestures ignores cancelled gestures, so a 4-finger swipe never also
# opens the launcher.
#
# hyprland.lua starts `libinput-gestures -c ~/.config/hypr/libinput-gestures.conf`;
# without -c it reads /etc/libinput-gestures.conf instead of this file.
#
# On a Lua config `hyprctl dispatch X` runs `return hl.dispatch(X)`, so X must
# be a Lua dispatcher.

# 4-finger click -> app launcher (the same shortcut as Super+R)
gesture hold on 4 hyprctl dispatch 'hl.dsp.global("quickshell:launcher-apps")'
