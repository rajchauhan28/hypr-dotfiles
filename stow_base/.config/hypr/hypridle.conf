# Idle behaviour.
#
# The wallpaper-derived colour palette (wallust/pywal) is optional: on a fresh
# install ~/.cache/wal does not exist yet, so every command below has to work
# without it.

general {
    lock_cmd = $HOME/.config/quickshell/lock/lock.sh
    # A boolean, not a program path. It previously read "/opt/spotify/spotify",
    # which the parser cannot read as a bool; the intent (let only Spotify
    # inhibit idle) is not something this option can express, so keep the
    # effective behaviour of honouring every D-Bus inhibitor.
    ignore_dbus_inhibit = false
}

listener {
    timeout = 270
    # Two separate faults used to make this notification impossible:
    #
    #   1. `source $HOME/.cache/wal/colors.sh && notify-send ...` -- the file
    #      does not exist on a fresh install, and `.`/`source` on a missing
    #      file ABORTS a non-interactive shell outright, so the `&&` right-hand
    #      side never ran. (`|| true` does not rescue it either; the shell is
    #      already gone. The `[ -r ]` guard is what makes it optional.)
    #   2. `-i $wallpaper` with $wallpaper unset leaves a dangling `-i`, and
    #      notify-send exits with "Missing argument for -i". ${var:+...} drops
    #      the whole flag when there is no icon to pass.
    on-timeout = if [ -r "$HOME/.cache/wal/colors.sh" ]; then . "$HOME/.cache/wal/colors.sh"; fi; notify-send "System" "You are about to be locked out!" ${wallpaper:+-i "$wallpaper"}
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
    on-resume = sleep 2; if [ -r "$HOME/.cache/wal/colors.sh" ]; then . "$HOME/.cache/wal/colors.sh"; fi; notify-send "System" "Unlocked! Hey $USER" ${wallpaper:+-i "$wallpaper"}
}

listener {
    timeout = 1200
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
